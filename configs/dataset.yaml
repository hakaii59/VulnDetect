# Paths to raw dataset files/directories and split parameters for
# scripts/build_dataset.py (Stage 1 - data pipeline).
#
# Download each dataset per docs/DATASETS.md and point `path` at the file
# (or directory of files, for MegaVul/PrimeVul) you downloaded. A dataset
# left unset/missing is skipped with a warning, so you can start iterating
# with just one dataset in place.
#
# `column_map` lets you fix a loader's field-name assumptions without
# touching Python code, when a dataset release renames a column. Logical
# field names each loader looks up (see src/vulnerachek/data/loaders/*.py
# module docstrings for the full list per dataset):
#   code, label, language, cwe_type, project, commit_id, func_name

datasets:
  megavul:
    enabled: true
    # File or directory containing megavul(_simple).json / per-language files
    path: data/raw/megavul
    column_map: {}

  bigvul:
    enabled: true
    # MSR_data_cleaned.csv from the Google Drive link in the upstream README
    path: data/raw/bigvul/MSR_data_cleaned.csv
    column_map: {}

  cvefixes:
    enabled: true
    # CVEfixes.db built from the Zenodo SQL dump (see docs/DATASETS.md)
    path: data/raw/cvefixes/CVEfixes.db
    column_map: {}
    # Uncomment and edit if the default join query doesn't match your release:
    # column_map:
    #   query: |
    #     SELECT mc.code AS code, mc.before_change AS before_change, ...

  primevul:
    enabled: true
    # Directory containing train.jsonl / valid.jsonl / test.jsonl, or one file
    path: data/raw/primevul
    column_map: {}

split:
  ratios: [0.8, 0.1, 0.1]
  names: [train, val, test]
  seed: 42

output_dir: data/processed
