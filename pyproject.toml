[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerachek-ai"
version = "0.1.0"
description = "3-layer (regex -> tree-sitter -> GraphCodeBERT) vulnerability detector for C/C++/Java, gating PRs in CI/CD."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
